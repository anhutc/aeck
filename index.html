<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AE Cây Khế</title>
    <meta name="description" content="Ứng dụng quản lý thu chi quỹ nhóm AE Cây Khế" />
    <meta property="og:title" content="AE Cây Khế" />
    <meta property="og:description" content="Ứng dụng quản lý thu chi quỹ nhóm AE Cây Khế" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var defaultMode = localStorage.getItem('quanlyquy_default_theme_mode_v2');
          if (!defaultMode) {
            var savedBranding = localStorage.getItem('quanlyquy_branding_v2') || localStorage.getItem('quanlyquy_branding');
            if (savedBranding) {
              var parsed = JSON.parse(savedBranding);
              if (parsed && (parsed.themeMode || parsed.defaultThemeMode)) {
                defaultMode = parsed.themeMode || parsed.defaultThemeMode;
              }
            }
          }
          if (!defaultMode) {
            defaultMode = localStorage.getItem('quanlyquy_theme_mode_v1') || 'light';
          }
          var isDark = defaultMode === 'dark' || (defaultMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-emerald-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
