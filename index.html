<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AE Cây Khế</title>
    <meta name="description" content="Ứng dụng quản lý thu chi quỹ nhóm AE Cây Khế" />
    <meta property="og:title" content="AE Cây Khế" />
    <meta property="og:description" content="Ứng dụng quản lý thu chi quỹ nhóm AE Cây Khế" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var defaultMode = localStorage.getItem('quanlyquy_default_theme_mode_v2');
          if (!defaultMode) {
            var savedBranding = localStorage.getItem('quanlyquy_branding_v2') || localStorage.getItem('quanlyquy_branding');
            if (savedBranding) {
              var parsed = JSON.parse(savedBranding);
              if (parsed && (parsed.themeMode || parsed.defaultThemeMode)) {
                defaultMode = parsed.themeMode || parsed.defaultThemeMode;
              }
            }
          }
          if (!defaultMode) {
            defaultMode = localStorage.getItem('quanlyquy_theme_mode_v1') || 'light';
          }
          var isDark = defaultMode === 'dark' || (defaultMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-emerald-600 selection:text-white transition-colors duration-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #059669, #0d9488); display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.35); margin-bottom: 20px;">
          🌳
        </div>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(5, 150, 105, 0.2); border-top-color: #059669; border-radius: 50%; animation: spin-loader 0.7s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; color: #0f172a;" id="loading-app-title">AE Cây Khế</h2>
        <p style="margin: 4px 0 0 0; font-size: 12px; color: #64748b;">Đang khởi động ứng dụng...</p>
        <style>
          @keyframes spin-loader {
            to { transform: rotate(360deg); }
          }
          @media (prefers-color-scheme: dark) {
            #loading-app-title { color: #f8fafc !important; }
          }
          .dark #loading-app-title { color: #f8fafc !important; }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
